[workspace]
members = [
  "crates/calculon-spa-node",
  "crates/calculon-spa-plugins",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2.189"
libspa = { package = "libspa-ao", git = "https://github.com/DarrylGamroth/PipeWireAO-rs.git", rev = "d6a34012b091753eb74e82ae4a2574ea9e1b846d", features = ["v1_2_0"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
